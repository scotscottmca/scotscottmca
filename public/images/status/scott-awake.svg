<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Illustration of Scott awake">
  
  <defs>
    <clipPath id="panel"><rect x="0" y="0" width="240" height="240" rx="28"/></clipPath>
    <radialGradient id="skin" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f8d7b0"/><stop offset="100%" stop-color="#e7ad81"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e79a4c"/><stop offset="100%" stop-color="#bf7229"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d88a3c"/><stop offset="100%" stop-color="#b06a26"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4152"/><stop offset="100%" stop-color="#232936"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe3ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8fb2e0" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="mug" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8a9bff"/><stop offset="100%" stop-color="#5566d8"/>
    </radialGradient>
    <!-- day room -->
    <linearGradient id="wallDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/><stop offset="100%" stop-color="#bcd8f5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c69a68"/><stop offset="100%" stop-color="#a2743f"/>
    </linearGradient>
    <radialGradient id="sunWin" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff3c4"/><stop offset="100%" stop-color="#bfe1ff"/>
    </radialGradient>
    <!-- night room -->
    <linearGradient id="wallNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26305f"/><stop offset="100%" stop-color="#161c3c"/>
    </linearGradient>
    <linearGradient id="duvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a74c8"/><stop offset="100%" stop-color="#3d55a3"/>
    </linearGradient>
    <radialGradient id="moonWin" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#20264f"/><stop offset="100%" stop-color="#0f1430"/>
    </radialGradient>
  </defs>
  
  <style>
    .sprite { animation: bob 3.4s ease-in-out infinite; transform-origin: 120px 200px; }
    @keyframes bob { 0%,100% { transform: translateY(0) ; } 50% { transform: translateY(-2.4px) ; } }
    
    .lids rect { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0);
                 animation: lid 4.8s ease-in-out infinite; }
    @keyframes lid { 0%,92%,100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
    .steam path { opacity: 0; }
    .s1 { animation: steam 2.6s ease-in-out infinite; }
    .s2 { animation: steam 2.6s ease-in-out infinite; animation-delay: .7s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(3px) scaleX(.8); }
                       35% { opacity: .8; } 100% { opacity: 0; transform: translateY(-8px) scaleX(1.1); } }
    
    @media (prefers-reduced-motion: reduce) {
      .sprite, .lids rect, .steam path, .zzz text { animation: none !important; }
      .lids rect { transform: scaleY(0) !important; }
    }
  </style>
  <g clip-path="url(#panel)">
    
  <rect x="0" y="0" width="240" height="240" fill="url(#wallDay)"/>
  <g>
    <rect x="150" y="34" width="66" height="66" rx="8" fill="url(#sunWin)" stroke="#e7f1ff" stroke-width="4"/>
    <circle cx="183" cy="60" r="15" fill="#ffd873"/>
    <line x1="183" y1="34" x2="183" y2="100" stroke="#e7f1ff" stroke-width="4"/>
    <line x1="150" y1="67" x2="216" y2="67" stroke="#e7f1ff" stroke-width="4"/>
  </g>
  <rect x="20" y="40" width="40" height="54" rx="6" fill="#cbb28f" opacity="0.5"/>
    <g transform="translate(26,46) scale(0.78)">
      <g class="sprite">
    
    <path d="M34 250 C34 196 74 176 120 176 C166 176 206 196 206 250 Z" fill="url(#shirt)"/>
    <path d="M96 178 C104 190 136 190 144 178 C140 172 100 172 96 178 Z" fill="#1b2029" opacity="0.7"/>
    <circle cx="120" cy="212" r="4.2" fill="#7bbf4b"/>
    <circle cx="120" cy="223" r="4.2" fill="#7bbf4b"/>
    <path d="M104 150 L136 150 L134 182 C130 190 110 190 106 182 Z" fill="url(#skin)"/>
    <path d="M104 150 L136 150 L135 160 C128 168 112 168 105 160 Z" fill="#d69f76" opacity="0.6"/>
    <circle cx="74" cy="104" r="9" fill="url(#skin)"/>
    <circle cx="166" cy="104" r="9" fill="url(#skin)"/>
    <ellipse cx="120" cy="96" rx="48" ry="52" fill="url(#skin)"/>
    <path d="M76 104 C84 113 96 119 108 119 C114 123 126 123 132 119
             C144 119 156 113 164 104 C170 141 150 172 120 172
             C90 172 70 141 76 104 Z" fill="url(#beard)"/>
    <path d="M92 150 C104 165 136 165 148 150 C138 160 102 160 92 150 Z" fill="#a5621f" opacity="0.5"/>
    <path d="M72 92 C64 44 96 26 120 26 C144 26 176 44 168 92
             C162 66 150 54 120 54 C90 54 78 66 72 92 Z" fill="url(#hair)"/>
    <path d="M120 54 C150 54 162 66 168 92 C166 70 156 60 138 56 C132 55 126 54 120 54 Z"
          fill="#a8641f" opacity="0.4"/>
    
    <path d="M86 78 C92 75 104 75 110 78" stroke="url(#beard)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M130 78 C136 75 148 75 154 78" stroke="url(#beard)" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <g class="eyes">
      <ellipse cx="97" cy="99" rx="7.5" ry="8.5" fill="#fff"/>
      <ellipse cx="143" cy="99" rx="7.5" ry="8.5" fill="#fff"/>
      <circle cx="98.5" cy="100" r="4.2" fill="#3f6f9e"/>
      <circle cx="144.5" cy="100" r="4.2" fill="#3f6f9e"/>
      <circle cx="98.5" cy="100" r="2" fill="#10233a"/>
      <circle cx="144.5" cy="100" r="2" fill="#10233a"/>
      <circle cx="96.5" cy="97.5" r="1.4" fill="#fff"/>
      <circle cx="142.5" cy="97.5" r="1.4" fill="#fff"/>
    </g>
    <g class="lids">
      <rect x="88" y="90" width="18" height="18" rx="8" fill="url(#skin)"/>
      <rect x="134" y="90" width="18" height="18" rx="8" fill="url(#skin)"/>
    </g>
    
    <g stroke="#15161b" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="82" y="86" width="30" height="24" rx="9" fill="url(#lens)"/>
      <rect x="128" y="86" width="30" height="24" rx="9" fill="url(#lens)"/>
      <path d="M112 94 C118 90 122 90 128 94"/>
      <path d="M82 96 L72 100"/><path d="M158 96 L168 100"/>
    </g>
    <path d="M118 108 C116 115 120 119 126 117" stroke="#d69f76" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M108 139 C114 149 126 149 132 139 C126 146 114 146 108 139 Z" fill="#6f2f28"/>
    <path d="M111 140 C116 144 124 144 129 140 C124 143 116 143 111 140 Z" fill="#fff"/>
  </g>
    </g>
    
  <g class="mugwrap">
    <g class="steam" fill="none" stroke="#7a5a36" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
      <path class="s1" d="M176 196 C172 190 180 186 176 180"/>
      <path class="s2" d="M186 196 C182 190 190 186 186 180"/>
    </g>
  </g>
  <path d="M0 240 L0 208 C0 202 4 198 10 198 L230 198 C236 198 240 202 240 208 L240 240 Z" fill="url(#desk)"/>
  <rect x="0" y="198" width="240" height="5" fill="#d8b587" opacity="0.7"/>
  <!-- laptop -->
  <rect x="86" y="176" width="68" height="26" rx="3" fill="#2b3140"/>
  <rect x="90" y="180" width="60" height="18" rx="2" fill="#8fd0ff"/>
  <rect x="78" y="200" width="84" height="8" rx="3" fill="#3a4152"/>
  <!-- coffee mug -->
  <path d="M168 200 h20 v10 a10 10 0 0 1 -20 0 Z" fill="url(#mug)"/>
  <path d="M188 202 a6 6 0 0 1 0 9" fill="none" stroke="#5566d8" stroke-width="3"/>
  <!-- little plant -->
  <rect x="30" y="206" width="20" height="16" rx="3" fill="#c96f4a"/>
  <path d="M40 206 C36 194 30 192 30 192 M40 206 C44 194 50 192 50 192 M40 206 C40 190 40 188 40 188"
        stroke="#5fae54" stroke-width="4" fill="none" stroke-linecap="round"/>
    
  </g>
  <rect x="1.5" y="1.5" width="237" height="237" rx="27" fill="none"
        stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>
