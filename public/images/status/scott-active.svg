<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Illustration of Scott active">
  
  <defs>
    <clipPath id="panel"><rect x="0" y="0" width="240" height="240" rx="28"/></clipPath>
    <radialGradient id="skin" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f8d7b0"/><stop offset="100%" stop-color="#e7ad81"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e79a4c"/><stop offset="100%" stop-color="#bf7229"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d88a3c"/><stop offset="100%" stop-color="#b06a26"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4152"/><stop offset="100%" stop-color="#232936"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5484d"/><stop offset="100%" stop-color="#b52f3c"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe3ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8fb2e0" stop-opacity="0.15"/>
    </linearGradient>
    <!-- gym -->
    <linearGradient id="wallGym" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2740"/><stop offset="100%" stop-color="#221826"/>
    </linearGradient>
    <!-- outdoors -->
    <linearGradient id="skyWalk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8ff"/><stop offset="100%" stop-color="#cfefff"/>
    </linearGradient>
    <!-- active -->
    <linearGradient id="wallActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1638"/><stop offset="100%" stop-color="#241033"/>
    </linearGradient>
  </defs>
  
  <style>
    .sprite { animation: bob 0.9s ease-in-out infinite; transform-origin: 120px 200px; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    
    .ring { transform-origin: 196px 56px; opacity: 0; }
    .r1 { animation: ping 1.6s ease-out infinite; }
    .r2 { animation: ping 1.6s ease-out infinite; animation-delay: .3s; }
    .r3 { animation: ping 1.6s ease-out infinite; animation-delay: .6s; }
    @keyframes ping { 0% { opacity: .7; transform: scale(.5); } 100% { opacity: 0; transform: scale(1.2); } }
    .ecg { stroke-dasharray: 460; stroke-dashoffset: 460; animation: trace 2.2s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    .wh { opacity: 0; }
    .w1 { animation: whoosh 1s ease-out infinite; }
    .w2 { animation: whoosh 1s ease-out infinite; animation-delay: .15s; }
    .w3 { animation: whoosh 1s ease-out infinite; animation-delay: .3s; }
    @keyframes whoosh { 0% { opacity: 0; transform: translateX(6px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateX(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      .sprite, .bar, .drop, .dog, .ring, .ecg, .wh { animation: none !important; }
      .drop, .wh, .ring { opacity: 0 !important; }
      .ecg { stroke-dashoffset: 0 !important; }
    }
  </style>
  <g clip-path="url(#panel)">
    
  <rect x="0" y="0" width="240" height="240" fill="url(#wallActive)"/>
  <circle class="ring r1" cx="196" cy="56" r="12" fill="none" stroke="#ff5470" stroke-width="3" opacity="0.7"/>
  <circle class="ring r2" cx="196" cy="56" r="22" fill="none" stroke="#ff5470" stroke-width="3" opacity="0.4"/>
  <circle class="ring r3" cx="196" cy="56" r="32" fill="none" stroke="#ff5470" stroke-width="3" opacity="0.2"/>
  <path d="M196 48 C193 44 187 45 187 51 C187 56 196 62 196 62 C196 62 205 56 205 51 C205 45 199 44 196 48 Z" fill="#ff5470"/>
    <g transform="translate(26,46) scale(0.78)">
      <g class="sprite">
    
    <path d="M34 250 C34 196 74 176 120 176 C166 176 206 196 206 250 Z" fill="url(#shirt)"/>
    <path d="M96 178 C104 190 136 190 144 178 C140 172 100 172 96 178 Z" fill="#1b2029" opacity="0.7"/>
    <path d="M104 150 L136 150 L134 182 C130 190 110 190 106 182 Z" fill="url(#skin)"/>
    <path d="M104 150 L136 150 L135 160 C128 168 112 168 105 160 Z" fill="#d69f76" opacity="0.6"/>
    <circle cx="74" cy="104" r="9" fill="url(#skin)"/>
    <circle cx="166" cy="104" r="9" fill="url(#skin)"/>
    <ellipse cx="120" cy="96" rx="48" ry="52" fill="url(#skin)"/>
    <path d="M76 104 C84 113 96 119 108 119 C114 123 126 123 132 119
             C144 119 156 113 164 104 C170 141 150 172 120 172
             C90 172 70 141 76 104 Z" fill="url(#beard)"/>
    <path d="M92 150 C104 165 136 165 148 150 C138 160 102 160 92 150 Z" fill="#a5621f" opacity="0.5"/>
    <path d="M72 92 C64 44 96 26 120 26 C144 26 176 44 168 92
             C162 66 150 54 120 54 C90 54 78 66 72 92 Z" fill="url(#hair)"/>
    <path d="M120 54 C150 54 162 66 168 92 C166 70 156 60 138 56 C132 55 126 54 120 54 Z"
          fill="#a8641f" opacity="0.4"/>
    
    <path d="M86 78 C92 75 104 75 110 78" stroke="url(#beard)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M130 78 C136 75 148 75 154 78" stroke="url(#beard)" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <g class="eyes">
      <ellipse cx="97" cy="99" rx="7.5" ry="8.5" fill="#fff"/>
      <ellipse cx="143" cy="99" rx="7.5" ry="8.5" fill="#fff"/>
      <circle cx="98.5" cy="100" r="4.2" fill="#3f6f9e"/>
      <circle cx="144.5" cy="100" r="4.2" fill="#3f6f9e"/>
      <circle cx="98.5" cy="100" r="2" fill="#10233a"/>
      <circle cx="144.5" cy="100" r="2" fill="#10233a"/>
      <circle cx="96.5" cy="97.5" r="1.4" fill="#fff"/>
      <circle cx="142.5" cy="97.5" r="1.4" fill="#fff"/>
    </g>
    
    <circle cx="72" cy="108" r="5.5" fill="#1c2029"/>
    <circle cx="168" cy="108" r="5.5" fill="#1c2029"/>
    <path d="M168 112 C179 124 177 146 167 158" stroke="#1c2029" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <g stroke="#15161b" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="82" y="86" width="30" height="24" rx="9" fill="url(#lens)"/>
      <rect x="128" y="86" width="30" height="24" rx="9" fill="url(#lens)"/>
      <path d="M112 94 C118 90 122 90 128 94"/>
      <path d="M82 96 L72 100"/><path d="M158 96 L168 100"/>
    </g>
    <path d="M118 108 C116 115 120 119 126 117" stroke="#d69f76" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M106 138 C114 150 126 150 134 138 C126 147 114 147 106 138 Z" fill="#6f2f28"/>
    <path d="M110 139 C116 144 124 144 130 139 C124 143 116 143 110 139 Z" fill="#fff"/>
  </g>
    </g>
    
  <path d="M0 240 L0 210 C60 202 180 202 240 210 L240 240 Z" fill="#241a30"/>
  <!-- ECG pulse across the floor -->
  <path class="ecg" d="M8 214 L64 214 L76 194 L90 230 L104 214 L150 214 L162 200 L172 222 L182 214 L240 214"
        fill="none" stroke="#ff5470" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- motion swoosh lines beside Scott -->
  <g stroke="#ff8fa3" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path class="wh w1" d="M30 120 L54 120"/>
    <path class="wh w2" d="M24 138 L52 138"/>
    <path class="wh w3" d="M32 156 L56 156"/>
  </g>
  </g>
  <rect x="1.5" y="1.5" width="237" height="237" rx="27" fill="none"
        stroke="#ff5470" stroke-opacity="0.28" stroke-width="2"/>
</svg>
